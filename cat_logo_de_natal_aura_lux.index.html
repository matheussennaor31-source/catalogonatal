<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Lux Design - Catálogo de Natal</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Mountains+of+Christmas:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #fdfbf7;
        }
        .font-christmas {
            font-family: 'Mountains of Christmas', cursive;
        }
        #cart-sidebar {
            transition: transform 0.3s ease-in-out;
            transform: translateX(100%);
        }
        #cart-sidebar.open {
            transform: translateX(0);
        }
        #cart-overlay {
            transition: opacity 0.3s ease-in-out;
            opacity: 0;
            pointer-events: none;
        }
        #cart-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
        @keyframes slideInUp {
            from { transform: translateY(100%); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .toast-enter {
            animation: slideInUp 0.3s ease-out forwards;
        }
        .toast-leave {
            animation: fadeOut 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="text-gray-800 relative min-h-screen pb-20">

    <!-- Cabeçalho -->
    <nav class="bg-red-800 text-white shadow-lg sticky top-0 z-40 border-b-4 border-yellow-500">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-tree text-2xl text-green-400"></i>
                    <span class="font-christmas text-2xl tracking-wide">Aura Lux Design</span>
                </div>
                <div>
                    <button onclick="toggleCart()" class="relative p-2 hover:bg-red-900 rounded-full transition-colors">
                        <i class="fa-solid fa-gift text-xl"></i>
                        <span id="cart-count" class="absolute top-0 right-0 inline-flex items-center justify-center px-2 py-1 text-xs font-bold leading-none text-red-900 bg-yellow-400 rounded-full transform translate-x-1/4 -translate-y-1/4">0</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- Conteúdo Principal -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="mb-8 text-center sm:text-left">
            <h1 class="text-4xl font-christmas text-red-800">Catálogo de Natal</h1>
            <p class="text-gray-600 mt-2 text-sm sm:text-base">Escolha seus enfeites, selecione a cor, a quantidade e envie seu pedido mágico pelo WhatsApp!</p>
        </div>

        <!-- Grid de Produtos -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6">
            <!-- Renderizado via JS -->
        </div>
    </main>

    <!-- Overlay do Carrinho -->
    <div id="cart-overlay" onclick="toggleCart()" class="fixed inset-0 bg-black bg-opacity-60 z-40"></div>

    <!-- Carrinho Lateral -->
    <div id="cart-sidebar" class="fixed top-0 right-0 w-full md:w-96 h-full bg-white shadow-2xl z-50 flex flex-col border-l-4 border-red-800">
        <div class="px-6 py-4 border-b border-gray-200 flex justify-between items-center bg-red-50">
            <h2 class="text-xl font-bold flex items-center gap-2 text-red-800">
                <i class="fa-solid fa-sleigh text-red-600"></i> Seu Trenó
            </h2>
            <button onclick="toggleCart()" class="text-gray-500 hover:text-red-600 transition-colors">
                <i class="fa-solid fa-times text-2xl"></i>
            </button>
        </div>
        
        <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-4">
            <div class="text-center text-gray-400 mt-10">
                <i class="fa-solid fa-box-open text-4xl mb-3"></i>
                <p>Seu carrinho está vazio.</p>
            </div>
        </div>

        <div class="border-t border-gray-200 p-6 bg-red-50">
            <div class="mb-4">
                <label for="customer-name" class="block text-sm font-semibold text-gray-700 mb-1">Seu Nome:</label>
                <input type="text" id="customer-name" placeholder="Como podemos te chamar?" class="w-full bg-white border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-red-500 focus:border-red-500 p-2.5 outline-none shadow-sm">
            </div>
            <div class="flex justify-between items-center mb-4">
                <span class="text-lg font-semibold text-gray-700">Total:</span>
                <span id="cart-total" class="text-2xl font-bold text-green-700">R$ 0,00</span>
            </div>
            <button onclick="sendOrderViaWhatsApp()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg shadow-md transition-colors flex justify-center items-center gap-2">
                <i class="fa-brands fa-whatsapp text-xl"></i>
                Enviar Pedido
            </button>
        </div>
    </div>

    <!-- Container Toast -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2"></div>

    <script>
        const WHATSAPP_NUMBER = "5535991685921"; 
        const DEFAULT_COLORS = ["Branco", "Bege", "Marrom", "Azul", "Amarelo", "Vermelho", "Verde Oliva"];
        const DEFAULT_IMAGE = "https://images.unsplash.com/photo-1543589077-47d81606c1bf?auto=format&fit=crop&w=500&q=60";

        const products = [
            { id: 1, name: "Jesus Sentado 4cm", price: 12.00, image: "163512_2.jpg" },
            { id: 2, name: "Árvore de Natal 13,5cm", price: 25.00, image: DEFAULT_IMAGE },
            { id: 3, name: "Árvore de Natal 18cm", price: 35.00, image: DEFAULT_IMAGE },
            { id: 4, name: "Feliz Natal com Rena 15x10cm", price: 20.00, image: DEFAULT_IMAGE },
            { id: 5, name: "Feliz Natal com Rena 10x7cm", price: 15.00, image: DEFAULT_IMAGE },
            { id: 6, name: "Bandeja para Natal 20x12cm", price: 20.00, image: DEFAULT_IMAGE },
            { id: 7, name: "Bonecos de Crochê 5cm", price: 15.00, image: "163511_2.png" },
            { id: 8, name: "Porta Doce Touca 14,5cm", price: 50.00, image: DEFAULT_IMAGE },
            { id: 9, name: "Porta Doce Árvore 14,5cm", price: 40.00, image: DEFAULT_IMAGE },
            { id: 10, name: "Porta Ferrero", price: 5.00, image: DEFAULT_IMAGE },
            { id: 11, name: "Presépio Clássico 11x12cm", price: 25.00, image: DEFAULT_IMAGE },
            { id: 12, name: "Presépio Minimalista 13x13cm", price: 30.00, image: "163509_2.png" },
            { id: 13, name: "Presépio Cesta 10x12cm", price: 35.00, image: "163510_2.png" },
            { id: 14, name: "Rena Decorativa 13,5cm", price: 20.00, image: "164092_2.png" },
            { id: 15, name: "Quebra Nozes 20cm", price: 25.00, image: "164093_2.png" },
            { id: 16, name: "Bandeja Oval 20cm x 12cm", price: 30.00, image: "164080_2.png" },
            { id: 17, name: "Anjo Decorativo 10cm", price: 25.00, image: "164081_2.png" },
            { id: 18, name: "Porta Guardanapo com 5un", price: 20.00, image: "164089_2.png" },
            { id: 19, name: "Sagrada Familia 10cm", price: 20.00, image: "164163_2.jpg" }
        ];

        let cart = [];

        const formatMoney = (value) => value.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            grid.innerHTML = '';

            products.forEach(product => {
                const colorOptions = DEFAULT_COLORS.map(color => `<option value="${color}">${color}</option>`).join('');
                
                const card = document.createElement('div');
                card.className = "bg-white rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col border border-red-100";
                card.innerHTML = `
                    <img src="${product.image}" alt="${product.name}" class="w-full h-48 object-cover rounded-t-lg">
                    <div class="p-5 flex flex-col flex-1">
                        <h3 class="text-base font-bold text-gray-900 leading-tight flex-1">${product.name}</h3>
                        <p class="text-xl font-bold text-green-700 mt-2">${formatMoney(product.price)}</p>
                        
                        <div class="mt-4">
                            <label class="block text-xs font-semibold text-gray-500 mb-1"><i class="fa-solid fa-palette"></i> Cor Desejada:</label>
                            <select id="color-${product.id}" class="w-full bg-gray-50 border border-gray-300 text-gray-900 text-sm rounded-lg focus:ring-red-500 focus:border-red-500 p-2 outline-none">
                                ${colorOptions}
                            </select>
                        </div>

                        <div class="mt-4 flex gap-2">
                            <div class="flex items-center border border-gray-300 rounded-lg bg-gray-50">
                                <button onclick="changeQuantity('qty-${product.id}', -1)" class="px-3 py-2 text-gray-600 hover:text-red-600 transition-colors rounded-l-lg"><i class="fa-solid fa-minus text-xs"></i></button>
                                <input type="number" id="qty-${product.id}" value="1" min="1" class="w-10 text-center text-sm font-bold bg-transparent border-0 focus:ring-0 p-0 text-gray-800 pointer-events-none" readonly>
                                <button onclick="changeQuantity('qty-${product.id}', 1)" class="px-3 py-2 text-gray-600 hover:text-green-600 transition-colors rounded-r-lg"><i class="fa-solid fa-plus text-xs"></i></button>
                            </div>
                            <button onclick="addToCart(${product.id})" class="flex-1 bg-red-700 hover:bg-red-800 text-white text-sm font-bold py-2 px-3 rounded-lg shadow transition-colors flex items-center justify-center gap-2">
                                Adicionar
                            </button>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function changeQuantity(inputId, delta) {
            const input = document.getElementById(inputId);
            let val = parseInt(input.value) + delta;
            if (val < 1) val = 1;
            input.value = val;
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const qtyInput = document.getElementById(`qty-${productId}`);
            const colorSelect = document.getElementById(`color-${productId}`);
            
            const quantity = parseInt(qtyInput.value);
            const color = colorSelect.value;

            const existingItemIndex = cart.findIndex(item => item.id === productId && item.color === color);

            if (existingItemIndex > -1) {
                cart[existingItemIndex].quantity += quantity;
            } else {
                cart.push({
                    id: product.id,
                    name: product.name,
                    price: product.price,
                    image: product.image,
                    quantity: quantity,
                    color: color
                });
            }

            qtyInput.value = 1;
            updateCartUI();
            showToast(`<b>${quantity}x ${product.name}</b> adicionado!`, "success");
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartUI();
        }

        function toggleCart() {
            document.getElementById('cart-sidebar').classList.toggle('open');
            document.getElementById('cart-overlay').classList.toggle('open');
        }

        function updateCartUI() {
            const container = document.getElementById('cart-items');
            const count = document.getElementById('cart-count');
            const total = document.getElementById('cart-total');

            count.innerText = cart.reduce((sum, item) => sum + item.quantity, 0);

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="text-center text-gray-400 mt-10">
                        <i class="fa-solid fa-gift text-5xl mb-3 text-gray-300"></i>
                        <p>Seu trenó está vazio.</p>
                    </div>`;
                total.innerText = "R$ 0,00";
                return;
            }

            container.innerHTML = '';
            let totalValue = 0;

            cart.forEach((item, index) => {
                const itemTotal = item.price * item.quantity;
                totalValue += itemTotal;

                container.innerHTML += `
                    <div class="flex items-center gap-4 bg-white p-3 rounded-xl border border-gray-200 shadow-sm relative">
                        <img src="${item.image}" alt="${item.name}" class="w-14 h-14 object-cover rounded-lg border border-gray-100">
                        <div class="flex-1">
                            <h4 class="text-sm font-bold text-gray-800 leading-tight">${item.name}</h4>
                            <span class="bg-yellow-100 text-yellow-800 text-[10px] font-bold px-2 py-0.5 rounded-full mt-1 inline-block">${item.color}</span>
                            <div class="flex justify-between items-center mt-2">
                                <span class="text-xs font-semibold text-gray-500">${item.quantity} un. x ${formatMoney(item.price)}</span>
                                <span class="text-sm font-bold text-green-700">${formatMoney(itemTotal)}</span>
                            </div>
                        </div>
                        <button onclick="removeFromCart(${index})" class="text-gray-400 hover:text-red-600 transition-colors p-2 absolute top-1 right-1">
                            <i class="fa-solid fa-trash-can text-sm"></i>
                        </button>
                    </div>
                `;
            });

            total.innerText = formatMoney(totalValue);
        }

        function sendOrderViaWhatsApp() {
            const customerNameInput = document.getElementById('customer-name');
            const customerName = customerNameInput.value.trim();

            if (cart.length === 0) {
                showToast("Adicione produtos antes de enviar!", "error");
                return;
            }
            if (!customerName) {
                showToast("Por favor, digite seu nome.", "error");
                customerNameInput.focus();
                return;
            }

            let text = "🎄 *NOVO PEDIDO DE NATAL* 🎄\n\n";
            text += `👤 *Cliente:* ${customerName}\n\n*--- RESUMO ---*\n`;
            let totalValue = 0;

            cart.forEach(item => {
                const itemTotal = item.price * item.quantity;
                totalValue += itemTotal;
                text += `🎁 *${item.quantity}x ${item.name}* (R$ ${item.price.toFixed(2).replace('.', ',')})\n`;
                text += `   ↳ Cor: ${item.color}\n   ↳ Subtotal: R$ ${itemTotal.toFixed(2).replace('.', ',')}\n\n`;
            });

            text += `*TOTAL:* R$ ${totalValue.toFixed(2).replace('.', ',')}\n\nFeliz Natal! 🎅✨`;

            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(text)}`, '_blank');
        }

        function showToast(message, type = "success") {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            toast.className = `${type === "success" ? "bg-green-600" : "bg-red-600"} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 toast-enter max-w-sm`;
            toast.innerHTML = `<i class="fa-solid ${type === "success" ? "fa-check-circle" : "fa-exclamation-circle"} text-lg"></i><span class="text-sm">${message}</span>`;

            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.replace('toast-enter', 'toast-leave');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        window.onload = renderProducts;
    </script>
</body>
</html>
